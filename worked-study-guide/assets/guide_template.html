<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>@@TITLE@@</title>
<style>

:root{--ink:#24384c;--navy:#123e55;--teal:#087b80;--muted:#52667b;--line:#ccdae2;--pale:#eef5f8;--gold:#a96318}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:20px}body{margin:0;background:#edf2f5;color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1080px;margin:30px auto;padding:0 24px 40px}header,section{background:white;padding:34px 42px;margin-bottom:23px;border:1px solid #dce6eb;border-radius:11px;box-shadow:0 4px 15px #163f5010}header{border-top:7px solid var(--teal)}h1,h2,h3,h4{line-height:1.25}h1,h2{color:var(--navy)}h1{font-size:2.25rem;margin:10px 0 18px}h2{font-size:1.7rem;margin:0 0 17px}h3{font-size:1.18rem;color:var(--teal);margin:27px 0 10px}h4{font-size:1.04rem;margin:19px 0 8px}p{margin:10px 0}.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);font-weight:750}.lead{font-size:1.18rem}.caption,.small{font-size:.88rem;color:var(--muted)}.eq{font-family:"Cambria Math",Cambria,Georgia,serif;background:var(--pale);border-left:3px solid #86afc3;padding:13px 18px;margin:14px 0;font-size:1.14rem;line-height:1.9;overflow-wrap:anywhere}.eq .line{display:block}.answer{background:#eaf7f0;border:1px solid #96c3b3;border-left:5px solid var(--teal);padding:15px 19px;border-radius:5px;margin:18px 0}.note{background:#fff9ed;border-left:4px solid #d3a651;padding:12px 17px;margin:16px 0}.prompt{padding:18px 22px;background:#f8fafb;border:1px solid var(--line);border-radius:7px;line-height:1.7}.check{border-top:1px solid var(--line);padding-top:13px;margin-top:20px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}.card{border:1px solid var(--line);border-radius:8px;padding:18px}.card h3:first-child,.card h4:first-child{margin-top:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;margin:15px 0;font-size:.95rem}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#e4eff3;color:var(--navy)}.figbox{border:1px solid var(--line);border-radius:8px;background:#fbfdff;padding:14px;margin:18px 0}.figure{display:block;width:100%;height:auto}.source-image{display:block;width:100%;height:auto;margin:8px auto;border:1px solid #d3dce2;cursor:zoom-in}.gap{text-align:center;font-size:.78rem;color:var(--muted);letter-spacing:.06em}.source{text-align:left;font-size:.85rem;color:var(--muted)}nav{display:flex;gap:10px;flex-wrap:wrap;margin:23px 0 17px}nav a,.button{background:#e8f3f4;border:1px solid #a9cccf;border-radius:6px;padding:8px 12px;color:#08686d;text-decoration:none;font-weight:650;font-size:.9rem}a{color:#066b81}button{cursor:pointer;font:inherit}button:hover,nav a:hover{background:#d7ecec}ul,ol{padding-left:25px}li{margin:8px 0}details{padding:12px 17px;border:1px solid var(--line);border-radius:7px;margin:15px 0}summary{cursor:pointer;font-weight:650;color:var(--teal)}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}input[type=range]{width:230px;accent-color:var(--teal)}input[type=number]{width:110px;padding:7px;border:1px solid #91a6b5;border-radius:4px;font:inherit}label{font-weight:650}.value{font-weight:700;font-variant-numeric:tabular-nums}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px}.result-box{border:1px solid #c0d9df;background:#f3f9fa;border-radius:6px;padding:12px}.result-box strong{display:block;font-size:1.13rem;color:var(--teal)}.result-box span{font-size:.86rem}dialog{border:0;border-radius:8px;padding:12px;max-width:96vw;max-height:95vh}dialog::backdrop{background:#102638bd}dialog img{display:block;max-width:92vw;max-height:81vh;width:auto;height:auto;margin-top:10px}dialog button{display:block;margin-left:auto}svg text{font-family:system-ui,"Segoe UI",sans-serif}footer{font-size:.85rem;color:var(--muted);text-align:center;padding:15px}.nowrap{white-space:nowrap}
@media(max-width:720px){body{font-size:16px}main{padding:0 10px;margin:14px auto}header,section{padding:25px 20px}.grid{grid-template-columns:1fr}h1{font-size:1.85rem}h2{font-size:1.45rem}.eq{font-size:1.03rem}.result-grid{grid-template-columns:1fr}th,td{padding:8px}.controls{align-items:flex-start}}
@media print{body{background:white;font-size:10.5pt}main{max-width:none;margin:0;padding:0}header,section{border:0;border-radius:0;box-shadow:none;padding:12px 0}section{break-before:page}nav,.screen-only,dialog{display:none!important}.eq,.answer,.figbox,table{break-inside:avoid}h2,h3{break-after:avoid}.grid{gap:15px}.card{padding:10px}footer{display:none}}

img{max-width:100%;height:auto}.source-image{max-width:100%;height:auto}.eyebrow:empty,.lead:empty{display:none}

@@EXTRA_CSS@@
</style></head><body><main>
<header><div class="eyebrow">Worked study guide</div><h1>@@TITLE@@</h1><p class="lead">@@SUBTITLE@@</p>@@INTRO@@<nav aria-label="Guide sections">@@NAVIGATION@@</nav></header>
@@SECTIONS@@
@@SOURCES@@
<footer>Worked study guide · From governing equations to solutions</footer>
</main><dialog id="image-dialog"><button class="button" id="close-image" type="button">Close source image</button><img id="enlarged-image" alt="Enlarged source image" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></dialog>
<script>
'use strict';
const sourceDialog=document.getElementById('image-dialog');
document.querySelectorAll('img.source-image').forEach(img=>{img.tabIndex=0;img.setAttribute('role','button');const open=()=>{const large=document.getElementById('enlarged-image');large.src=img.src;large.alt=img.alt;sourceDialog.showModal();};img.addEventListener('click',open);img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});});
document.getElementById('close-image').addEventListener('click',()=>sourceDialog.close());
sourceDialog.addEventListener('click',e=>{if(e.target===sourceDialog)sourceDialog.close();});
@@EXTRA_JS@@
</script></body></html>
